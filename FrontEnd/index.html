<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary Meta Tags -->
    <title>ArisingBox — Website Development, Meta Ads & Video Editing</title>
    <meta
      name="title"
      content="ArisingBox — Website Development, Meta Ads & Video Editing"
    />
    <meta
      name="description"
      content="ArisingBox builds high-performance websites, scales businesses with targeted Meta Ads, and produces high-retention reels and short-form video content."
    />
    <meta name="author" content="Rohit Kumar Munda" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://arising-box.netlify.app/" />

    <!-- Open Graph / Facebook / WhatsApp (Absolute URLs) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://arising-box.netlify.app/" />
    <meta property="og:title" content="ArisingBox — Website Development, Meta Ads & Video Editing" />
    <meta
      property="og:description"
      content="ArisingBox builds high-performance websites, scales businesses with targeted Meta Ads, and produces high-retention reels and short-form video content."
    />
    <meta property="og:image" content="https://arising-box.netlify.app/og-preview.png" />
    <meta property="og:image:secure_url" content="https://arising-box.netlify.app/og-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ArisingBox — Websites, Meta Ads & Video Editing founded by Rohit Kumar Munda" />

    <!-- Twitter Card (Absolute URLs) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://arising-box.netlify.app/" />
    <meta name="twitter:title" content="ArisingBox — Website Development, Meta Ads & Video Editing" />
    <meta
      name="twitter:description"
      content="ArisingBox builds high-performance websites, scales businesses with targeted Meta Ads, and produces high-retention reels and short-form video content."
    />
    <meta name="twitter:image" content="https://arising-box.netlify.app/og-preview.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "ArisingBox",
        "url": "https://arising-box.netlify.app/",
        "image": "https://arising-box.netlify.app/og-preview.png",
        "description": "Digital growth agency providing full-stack website development, Meta ad campaigns, and short-form video editing.",
        "founder": {
          "@type": "Person",
          "name": "Rohit Kumar Munda"
        },
        "knowsAbout": [
          "Website Development",
          "Meta Ads",
          "Short-Form Video Editing",
          "MERN Stack"
        ]
      }
    </script>

    <!-- Theme Initialization Script -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("ArisingBox-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-ink text-offwhite font-body">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
